name: cloud-bulldozer

on:
  push:
    branches: [ main ]
    paths-ignore:
    - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
    - '**.md'

jobs:

  build-containers:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: sudo apt-get update || true && sudo apt-get install -y qemu-user-static podman fuse-overlayfs

    - name: Login in quay
      if: github.event_name == 'push'
      run: podman login quay.io -u ${QUAY_USER} -p ${QUAY_TOKEN}
      env:
        QUAY_USER: ${{ secrets.QUAY_USER }}
        QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}

    - name: Detect changed images
      if: github.event_name == 'pull_request'
      id: changed
      run: |
        CHANGED_REPOS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | xargs -I{} dirname {} | sort -u | while read dir; do
          if [ -f "$dir/Dockerfile" ] || [ -f "$dir/Containerfile" ]; then
            echo "$dir"
          fi
        done | tr '\n' ' ')
        echo "repos=${CHANGED_REPOS}" >> "$GITHUB_OUTPUT"
        echo "Changed image directories: ${CHANGED_REPOS:-none}"

    - name: Build containers only (PR)
      if: github.event_name == 'pull_request' && steps.changed.outputs.repos != ''
      run: make build REPOS="${{ steps.changed.outputs.repos }}"

    - name: Build and push containers (main branch)
      if: github.event_name == 'push'
      run: make 
